      if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        var l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = '/icons/apple-touch-icon.png?v=4'; document.head.appendChild(l);
      }
    </script>
