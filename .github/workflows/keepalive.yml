name: Keep Supabase awake
# The free Supabase plan pauses a project after about a week with no use.
# This asks the database one small question every day so that does not happen.
# Add the two values below as repository secrets (Settings, Secrets and variables, Actions). Never put them in a file.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/keepalive.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
